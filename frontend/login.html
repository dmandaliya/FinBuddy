<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinBuddy — Sign in</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">FinBuddy 💰</div>
      <div class="login-tagline">Your personal AI money coach</div>

      <!-- Toggle between login and signup -->
      <div class="tab-row">
        <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Sign in</button>
        <button class="tab-btn" id="tab-signup" onclick="showTab('signup')">Create account</button>
      </div>

      <div id="alert-box"></div>

      <!-- Login form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary full-width" id="login-btn">Sign in</button>
      </form>

      <!-- Signup form (hidden by default) -->
      <form id="signup-form" class="hidden" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label class="form-label">Your name</label>
          <input type="text" id="signup-name" class="form-input" placeholder="e.g. Deep" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="signup-password" class="form-input" placeholder="min 6 characters" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary full-width" id="signup-btn">Create account</button>
      </form>

      <p class="text-muted mt-16" style="font-size:12px; text-align:center;">
        Your data is private and stays in your own database.
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
